apiVersion: v1
kind: ServiceAccount
metadata:
  name: python-hello-openshift
  namespace: tracing-demo
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: python-hello-openshift
  namespace: tracing-demo
  labels:
    app: python-hello-openshift
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-hello-openshift
  template:
    metadata:
      labels:
        app: python-hello-openshift
      annotations:
        instrumentation.opentelemetry.io/inject-python: 'true' # This annotation enables OpenTelemetry auto-instrumentation for Python applications. It tells the OpenTelemetry Operator to inject the necessary instrumentation libraries and configurations into the application container.
    spec:
      containers:
        - name: python-hello-openshift
          image: 'ghcr.io/nutmos/python-hello-openshift:0.1'
          ports:
            - containerPort: 8000
              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      serviceAccountName: python-hello-openshift
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
---
kind: Service
apiVersion: v1
metadata:
  name: python-hello-openshift
  namespace: tracing-demo
  labels:
    app: python-hello-openshift
spec:
  ports:
    - name: 8000-tcp
      protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
  selector:
    app: python-hello-openshift
---
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: python-hello-openshift
  namespace: tracing-demo
  labels:
    app: python-hello-openshift
  annotations:
    openshift.io/host.generated: 'true'
spec:
  to:
    kind: Service
    name: python-hello-openshift
    weight: 100
  port:
    targetPort: 8080-tcp
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: None
  wildcardPolicy: None
