kind: Secret
apiVersion: v1
metadata:
  name: quay-demo-config
  namespace: registry
type: Opaque
stringData:
  config.yaml: |
    DISTRIBUTED_STORAGE_PREFERENCE:
        - s3Storage
    DISTRIBUTED_STORAGE_DEFAULT_LOCATIONS: []
    DISTRIBUTED_STORAGE_CONFIG:
      s3Storage:
        - S3Storage
        - host: s3.<region>.amazonaws.com
          s3_access_key: <access-key>
          s3_secret_key: <secret-key>
          s3_bucket: <bucket>
          s3_region: <region>
          storage_path: /datastorage/registry
    FEATURE_SUPERUSERS_FULL_ACCESS: true
    SUPER_USERS: # The list of users you would like to grant superuser permission.
      - quayadmin


