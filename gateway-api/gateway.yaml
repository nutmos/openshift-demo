apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: default-gateway
  namespace: demo
spec:
  gatewayClassName: istio
  listeners:
  - allowedRoutes:
      namespaces:
        from: All
    name: default
    port: 80
    protocol: HTTP
    hostname: "*.greeter.cluster-tf4q6.tf4q6.sandbox3743.opentlc.com"
  - allowedRoutes:
      namespaces:
        from: All
    name: default-https
    port: 443
    protocol: HTTPS
    hostname: "*.greeter.cluster-tf4q6.tf4q6.sandbox3743.opentlc.com"
    tls:
      certificateRefs:
      - kind: Secret
        group: ""
        name: greeter-cert
  - allowedRoutes:
      namespaces:
        from: All
    name: grpc
    port: 50051
    protocol: HTTPS
    hostname: "gateway.greeter.cluster-tf4q6.tf4q6.sandbox3743.opentlc.com"
    tls:
      certificateRefs:
      - kind: Secret
        group: ""
        name: greeter-cert